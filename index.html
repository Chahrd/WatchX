<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchX - Free Movies & HD Streaming</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .ad-slot { background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #0f172a 10px, #0f172a 20px); }
    .aspect-video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.75rem; }
    .aspect-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Header Navigation -->
  <header class="sticky top-0 z-50 glass px-4 py-3 flex items-center justify-between border-b border-gray-800">
    <div class="flex items-center gap-2 cursor-pointer" onclick="fetchTrendingMovies()">
      <i class="fa-solid fa-play text-red-500 text-2xl"></i>
      <span class="text-2xl font-black tracking-wider text-white">Watch<span class="text-red-500">X</span></span>
    </div>
    
    <div class="flex items-center gap-3">
      <button onclick="requestOwnerAccess()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-bold px-3 py-2 rounded-lg border border-gray-700 flex items-center gap-1.5">
        <i class="fa-solid fa-lock text-red-500"></i> Owner Panel
      </button>
    </div>
  </header>

  <!-- Top Ad Slot -->
  <div class="w-full bg-gray-950 py-2 border-b border-gray-800 text-center">
    <div id="headerAdContainer" class="max-w-4xl mx-auto min-h-[50px] ad-slot flex items-center justify-center rounded border border-gray-800 p-1">
      <span class="text-xs text-gray-500 font-mono tracking-widest">[ TOP BANNER AD AREA ]</span>
    </div>
  </div>

  <!-- Search Input -->
  <div class="max-w-4xl mx-auto px-4 mt-6 w-full">
    <div class="relative w-full">
      <input type="text" id="searchInput" placeholder="Search WatchX for any movie..." 
        class="w-full bg-gray-900/90 text-white text-sm rounded-xl py-3 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-red-500 border border-gray-800 shadow-lg">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-base"></i>
    </div>
  </div>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full space-y-8 flex-1">

    <!-- Embedded Player Block -->
    <section id="detailsSection" class="hidden glass p-4 md:p-6 rounded-2xl border border-gray-800 space-y-6">
      <div class="space-y-3">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h3 id="playerTitle" class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-circle-play text-red-500"></i> Streaming HD Player
          </h3>
          
          <div class="flex gap-2">
            <button onclick="switchServer(1)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-gray-700">Server 1</button>
            <button onclick="switchServer(2)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-gray-700">Server 2</button>
            <button onclick="switchServer(3)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-gray-700">Server 3</button>
          </div>
        </div>

        <div class="aspect-video-container bg-black border border-gray-800 shadow-2xl">
          <iframe id="videoPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>
        </div>
      </div>

      <div class="flex flex-col md:flex-row gap-6 pt-2 border-t border-gray-800">
        <img id="detailPoster" class="w-28 md:w-44 rounded-xl object-cover shadow-xl border border-gray-700 self-start" src="" alt="Poster">
        <div class="space-y-3 flex-1">
          <div>
            <h2 id="detailTitle" class="text-2xl md:text-3xl font-bold text-white"></h2>
            <div class="flex items-center gap-3 mt-1.5">
              <span id="detailRating" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 text-xs font-bold px-2.5 py-1 rounded-lg">
                <i class="fa-solid fa-star"></i> <span>0.0</span>
              </span>
              <span id="detailDate" class="text-xs text-gray-
