<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Monetag Verification Meta Tag -->
  <meta name="monetag" content="ab8032d4...">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WatchX - Free Movies & HD Streaming</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .ad-slot { background: repeating-linear-gradient(45deg, #1e293b, #1e293b 10px, #0f172a 10px, #0f172a 20px); }
    .aspect-video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.75rem; }
    .aspect-video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- WatchX Navigation Header -->
  <header class="sticky top-0 z-50 glass px-4 py-3 flex items-center justify-between border-b border-gray-800">
    <div class="flex items-center gap-2 cursor-pointer" onclick="fetchTrendingMovies()">
      <i class="fa-solid fa-play text-red-500 text-2xl"></i>
      <span class="text-2xl font-black tracking-wider text-white">Watch<span class="text-red-500">X</span></span>
    </div>
    
    <div class="flex items-center gap-3">
      <!-- Protected Owner Button -->
      <button onclick="requestOwnerAccess()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-bold px-3 py-2 rounded-lg border border-gray-700 flex items-center gap-1.5 opacity-80 hover:opacity-100">
        <i class="fa-solid fa-lock text-red-500"></i> Owner Panel
      </button>
    </div>
  </header>

  <!-- Top Banner Ad Area -->
  <div class="w-full bg-gray-950 py-2 border-b border-gray-800 text-center">
    <div id="headerAdContainer" class="max-w-4xl mx-auto min-h-[50px] ad-slot flex items-center justify-center rounded border border-gray-800 p-1">
      <span class="text-xs text-gray-500 font-mono tracking-widest">[ TOP BANNER AD AREA ]</span>
    </div>
  </div>

  <!-- Search Bar Section -->
  <div class="max-w-4xl mx-auto px-4 mt-6 w-full">
    <div class="relative w-full">
      <input type="text" id="searchInput" placeholder="Search WatchX for any movie (e.g. Avatar, Inception, Titanic)..." 
        class="w-full bg-gray-900/90 text-white text-sm rounded-xl py-3 pl-11 pr-4 focus:outline-none focus:ring-2 focus:ring-red-500 border border-gray-800 shadow-lg">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-base"></i>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="max-w-6xl mx-auto px-4 py-6 w-full space-y-8 flex-1">

    <!-- Embedded Video Player & Details Section -->
    <section id="detailsSection" class="hidden glass p-4 md:p-6 rounded-2xl border border-gray-800 space-y-6">
      
      <!-- Live Video Streaming Player -->
      <div class="space-y-3">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <h3 id="playerTitle" class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-circle-play text-red-500"></i> Streaming HD Player
          </h3>
          
          <!-- Multi-Server Selector -->
          <div class="flex gap-2">
            <button onclick="switchServer(1)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-gray-700">Server 1</button>
            <button onclick="switchServer(2)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-gray-700">Server 2</button>
            <button onclick="switchServer(3)" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-semibold px-2.5 py-1.5 rounded border border-gray-700">Server 3</button>
          </div>
        </div>

        <!-- Video Iframe Container -->
        <div class="aspect-video-container bg-black border border-gray-800 shadow-2xl relative">
          <iframe id="videoPlayer" src="" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"></iframe>
        </div>
      </div>

      <!-- Movie Details -->
      <div class="flex flex-col md:flex-row gap-6 pt-2 border-t border-gray-800">
        <img id="detailPoster" class="w-28 md:w-44 rounded-xl object-cover shadow-xl border border-gray-700 self-start" src="" alt="Poster">
        <div class="space-y-3 flex-1">
          <div>
            <h2 id="detailTitle" class="text-2xl md:text-3xl font-bold text-white"></h2>
            <div class="flex items-center gap-3 mt-1.5">
              <span id="detailRating" class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 text-xs font-bold px-2.5 py-1 rounded-lg">
                <i class="fa-solid fa-star"></i> <span>0.0</span>
              </span>
              <span id="detailDate" class="text-xs text-gray-400"></span>
            </div>
          </div>

          <p id="detailOverview" class="text-gray-300 text-sm leading-relaxed"></p>

          <!-- Monetag Direct Link Backup -->
          <div class="pt-2">
            <a id="streamBtn" href="https://uplcm.com/4/12096174" target="_blank" class="inline-flex items-center gap-2 text-xs font-semibold text-red-400 hover:text-red-300 underline">
              <i class="fa-solid fa-external-link"></i> External High-Speed Mirror Link
            </a>
          </div>
        </div>
      </div>
    </section>

    <!-- Trending Movies Grid -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <h3 id="gridTitle" class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-fire text-red-500"></i> Trending Movies Today
        </h3>
      </div>

      <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Dynamic Movies -->
      </div>
    </section>

  </main>

  <!-- Sticky Bottom Anchor Ad Slot -->
  <div class="sticky bottom-0 z-40 w-full bg-gray-950/95 backdrop-blur border-t border-gray-800 p-2 text-center">
    <div id="footerAdContainer" class="max-w-4xl mx-auto min-h-[50px] ad-slot flex items-center justify-center rounded border border-gray-800 p-1">
      <span class="text-xs text-gray-500 font-mono tracking-widest">[ FOOTER AD SLOT ]</span>
    </div>
  </div>

  <!-- Protected Owner Panel Modal -->
  <div id="ownerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass max-w-lg w-full rounded-2xl p-6 border border-gray-700 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-shield-halved text-red-500"></i> WatchX Owner Panel</h3>
        <button onclick="closeOwnerModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-gray-300 font-semibold mb-1">Header Ad Script (Monetag Native/Push):</label>
          <textarea id="headerAdInput" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white text-xs font-mono"></textarea>
        </div>
        <div>
          <label class="block text-gray-300 font-semibold mb-1">Footer Ad Script (Monetag Native/Push):</label>
          <textarea id="footerAdInput" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white text-xs font-mono"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-gray-800">
        <button onclick="closeOwnerModal()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-xs">Cancel</button>
        <button onclick="saveOwnerSettings()" class="bg-red-600 text-white px-5 py-2 rounded-lg text-xs font-bold">Save & Apply</button>
      </div>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = "2910b54da641c7f61182b51e5bce4c28";
    const MONETAG_LINK = "https://uplcm.com/4/12096174";
    const OWNER_PASSWORD = "0102"; 

    let moviesList = [];
    let currentTmdbId = null;

    window.addEventListener('DOMContentLoaded', () => {
      const savedHeaderAd = localStorage.getItem('header_ad');
      const savedFooterAd = localStorage.getItem('footer_ad');

      if (savedHeaderAd) {
        document.getElementById('headerAdInput').value = savedHeaderAd;
        document.getElementById('headerAdContainer').innerHTML = savedHeaderAd;
      }
      if (savedFooterAd) {
        document.getElementById('footerAdInput').value = savedFooterAd;
        document.getElementById('footerAdContainer').innerHTML = savedFooterAd;
      }

      fetchTrendingMovies();
    });

    function requestOwnerAccess() {
      const pwd = prompt("Enter Owner Passkey:");
      if (pwd === OWNER_PASSWORD) {
        document.getElementById('ownerModal').classList.remove('hidden');
      } else if (pwd !== null) {
        alert("Access Denied: Incorrect Passkey!");
      }
    }

    function closeOwnerModal() { 
      document.getElementById('ownerModal').classList.add('hidden'); 
    }

    function saveOwnerSettings() {
      localStorage.setItem('header_ad', document.getElementById('headerAdInput').value);
      localStorage.setItem('footer_ad', document.getElementById('footerAdInput').value);

      closeOwnerModal();
      location.reload();
    }

    async function fetchTrendingMovies() {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_API_KEY}`);
        const data = await res.json();
        
        if (data.results && data.results.length > 0) {
          moviesList = data.results;
          displayMoviesGrid(moviesList);
        }
      } catch (err) {
        console.error("Error fetching TMDB movies:", err);
      }
    }

    function displayMoviesGrid(movies) {
      const grid = document.getElementById('movieGrid');
      grid.innerHTML = movies.map(m => `
        <div onclick="selectMovie(${m.id})" class="glass rounded-xl overflow-hidden cursor-pointer hover:scale-105 transition duration-300 border border-gray-800">
          <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" alt="${m.title}" class="w-full h-64 object-cover" onerror="this.src='https://via.placeholder.com/500x750?text=No+Poster'">
          <div class="p-3 space-y-1">
            <div class="flex justify-between items-center text-xs">
              <span class="text-yellow-400 font-bold"><i class="fa-solid fa-star"></i> ${m.vote_average ? m.vote_average.toFixed(1) : 'N/A'}</span>
              <span class="text-gray-500">${(m.release_date || '').split('-')[0]}</span>
            </div>
            <h4 class="text-sm font-bold text-white truncate">${m.title}</h4>
          </div>
        </div>
      `).join('');
    }

    function selectMovie(id) {
      const m = moviesList.find(item => item.id === id);
      if (!m) return;

      currentTmdbId = id;

      document.getElementById('detailsSection').classList.remove('hidden');
      document.getElementById('detailTitle').innerText = m.title;
      document.getElementById('detailOverview').innerText = m.overview || 'No overview available.';
      document.getElementById('detailRating').querySelector('span').innerText = m.vote_average ? m.vote_average.toFixed(1) : 'N/A';
      document.getElementById('detailDate').innerText = m.release_date ? `Released: ${m.release_date}` : '';
      document.getElementById('detailPoster').src = `https://image.tmdb.org/t/p/w500${m.poster_path}`;

      switchServer(1);

      document.getElementById('streamBtn').href = MONETAG_LINK;
      document.getElementById('detailsSection').scrollIntoView({ behavior: 'smooth' });
    }

    function switchServer(serverNum) {
      if (!currentTmdbId) return;
      const iframe = document.getElementById('videoPlayer');
      
      if (serverNum === 1) {
        iframe.src = `https://vidsrc.xyz/embed/movie/${currentTmdbId}`;
      } else if (serverNum === 2) {
        iframe.src = `https://www.2embed.cc/embed/${currentTmdbId}`;
      } else if (serverNum === 3) {
        iframe.src = `https://vidsrc.me/embed/movie?tmdb=${currentTmdbId}`;
      }
    }

    document.getElementById('searchInput').addEventListener('input', async (e) => {
      const query = e.target.value.trim();

      if (!query) {
        displayMoviesGrid(moviesList);
        document.getElementById('gridTitle').innerHTML = `<i class="fa-solid fa-fire text-red-500"></i> Trending Movies Today`;
        return;
      }

      if (query.length > 2) {
        try {
          const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
          const data = await res.json();
          if (data.results) {
            moviesList = data.results;
            displayMoviesGrid(data.results);
            document.getElementById('gridTitle').innerText = `Search Results for "${query}"`;
          }
        } catch (err) {
          console.error("Search error:", err);
        }
      }
    });
  </script>
</body>
</html>
